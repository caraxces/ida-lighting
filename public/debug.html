<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Overlay</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Arial', sans-serif;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
    }
    .content {
      text-align: center;
      color: white;
    }
    .title {
      font-size: 2rem;
      margin-bottom: 2rem;
      font-weight: bold;
    }
    .instruction {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      opacity: 0.8;
    }
    .button {
      margin-top: 2rem;
      padding: 0.7rem 1.5rem;
      background-color: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: rgba(255,255,255,0.2);
    }
    .hidden {
      display: none;
    }
    .main-content {
      padding: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="overlay" class="overlay">
    <div class="content">
      <div class="title">GIẢI PHÁP CHIẾU SÁNG CHUYÊN NGHIỆP</div>
      <div class="instruction" id="blink-text">Nhấn vào màn hình để khám phá thế giới ánh sáng</div>
      <button class="button" id="continueBtn">NHẤN ĐỂ TIẾP TỤC</button>
    </div>
  </div>
  
  <div class="main-content" id="mainContent">
    <h1>Trang web đã được hiển thị thành công!</h1>
    <p>Overlay đã biến mất khi bạn nhấn vào màn hình.</p>
  </div>

  <script>
    // Make text blink
    const blinkText = document.getElementById('blink-text');
    setInterval(() => {
      blinkText.style.opacity = blinkText.style.opacity === '0.5' ? '1' : '0.5';
    }, 500);
    
    // Handle overlay dismiss
    function dismissOverlay() {
      console.log('Overlay dismissed');
      document.getElementById('overlay').classList.add('hidden');
      
      // Play audio
      try {
        const audio = new Audio('sound-jazz.mp3');
        audio.loop = true;
        audio.volume = 0.5;
        audio.play().catch(e => console.error('Audio play failed:', e));
      } catch (error) {
        console.error('Error playing audio:', error);
      }
    }
    
    // Add click event to entire overlay
    document.getElementById('overlay').addEventListener('click', function(e) {
      console.log('Overlay clicked');
      dismissOverlay();
    });
    
    // Add click event to button
    document.getElementById('continueBtn').addEventListener('click', function(e) {
      console.log('Button clicked');
      e.stopPropagation(); // Prevent bubbling to overlay
      dismissOverlay();
    });
    
    // Listen for keyboard events
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') {
        console.log('Key pressed:', e.key);
        if (!document.getElementById('overlay').classList.contains('hidden')) {
          dismissOverlay();
        }
      }
    });
  </script>
</body>
</html>
